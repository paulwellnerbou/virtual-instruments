[project]
name = "vinst"
version = "0.1.0"
description = "Virtual Instrument Creator: build DecentSampler instruments and SF2 soundfonts from recordings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/vinst/vendor/decentsampler_schema/LICENSE"]
authors = [
    { name = "Paul Wellner Bou", email = "paul@wellnerbou.de" }
]
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0.1",
    "lxml>=6.1.3",
    "nicegui>=4.0.0",
    "numpy>=2.5.5",
    "pydantic>=2.14.3",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "tomli-w>=1.2.0",
    "typer>=0.29.2",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
vinst = "vinst.cli:app"
